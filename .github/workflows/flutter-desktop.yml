name: Build Flutter desktop

on:
  workflow_dispatch:
    inputs:
      target:
        description: Desktop platforms to build
        type: choice
        options: [windows, all]
        default: windows
      supabase_url:
        description: Public Supabase project URL (optional)
        type: string
        required: false
      supabase_publishable_key:
        description: Public Supabase publishable key (never service_role)
        type: string
        required: false
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: flutter-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target != 'all' && '[{"name":"windows","os":"windows-latest","target":"windows"}]' || '[{"name":"linux","os":"ubuntu-latest","target":"linux"},{"name":"windows","os":"windows-latest","target":"windows"},{"name":"macos","os":"macos-latest","target":"macos"}]') }}

    env:
      SUPABASE_URL: ${{ inputs.supabase_url || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase_publishable_key || vars.SUPABASE_PUBLISHABLE_KEY }}
      API_URL: ${{ vars.API_URL }}
      COVERS_PROXY_URL: ${{ vars.COVERS_PROXY_URL }}
      UPDATE_FEED_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        id: flutter_sdk
        continue-on-error: true
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install pinned Flutter from official Git tag when archive is unavailable
        if: steps.flutter_sdk.outcome == 'failure'
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/waveify-flutter"
          echo "$RUNNER_TEMP/waveify-flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/waveify-flutter/bin/flutter" --version

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text()
          match = re.search(r'^version:\s*([^\s]+)', text, re.M)
          if not match:
              raise SystemExit('Could not find version in pubspec.yaml')
          print(match.group(1).strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev libkeybinder-3.0-dev

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/windows-smoke
          flutter build ${{ matrix.target }} --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=COVERS_PROXY_URL="$COVERS_PROXY_URL" \
            --dart-define=UPDATE_FEED_URL="$UPDATE_FEED_URL" 2>&1 | tee build/windows-smoke/native-build.log

      - name: Include Windows C++ runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ redistributable DLL directory not found' }
          Copy-Item "$($crt.FullName)\*.dll" build\windows\x64\runner\Release\

      - name: Verify native Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tool/windows-smoke.ps1

      - name: Generate Windows installer and portable archive
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc '/DAppVersion=${{ steps.version.outputs.version }}' windows\installer\waveify.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compiler failed: $LASTEXITCODE" }
          Copy-Item build\windows\installer\Waveify-Setup.exe 'build/Waveify-${{ steps.version.outputs.version }}-windows.exe'
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'build/Waveify-${{ steps.version.outputs.version }}-windows-portable.zip'

      - name: Verify installed Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $setup = (Resolve-Path build/windows/installer/Waveify-Setup.exe).Path
          $installPath = Join-Path $env:RUNNER_TEMP 'Waveify-installed'
          $install = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          try {
            ./tool/windows-smoke.ps1 -Executable (Join-Path $installPath 'waveify.exe') -OutputDirectory build/windows-smoke/installed
          } finally {
            $uninstall = Join-Path $installPath 'unins000.exe'
            if (Test-Path $uninstall) {
              Start-Process $uninstall -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
            }
          }

      - name: Upload Windows diagnostics
        if: always() && matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Waveify-windows-diagnostics
          path: |
            build/windows-smoke/
            build/windows/x64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 30

      - name: Package Linux app
        if: matrix.target == 'linux'
        shell: bash
        run: tar -C build/linux/x64/release -czf 'build/Waveify-${{ steps.version.outputs.version }}-linux.tar.gz' bundle

      - name: Package macOS app
        if: matrix.target == 'macos'
        shell: bash
        run: |
          APP_PATH="build/macos/Build/Products/Release/Waveify.app"
          ZIP_PATH="build/Waveify-${{ steps.version.outputs.version }}-macos.zip"
          if [ ! -d "$APP_PATH" ]; then
            echo "Missing macOS app bundle: $APP_PATH" >&2
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: Upload desktop build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waveify-${{ matrix.target }}
          path: |
            build/Waveify-${{ steps.version.outputs.version }}-${{ matrix.target }}.*
            build/Waveify-${{ steps.version.outputs.version }}-${{ matrix.target }}*.zip
            build/Waveify-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish update feed and release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve app version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text()
          match = re.search(r'^version:\s*([^\s]+)', text, re.M)
          if not match:
              raise SystemExit('Could not find version in pubspec.yaml')
          print(match.group(1).strip())
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        shell: bash
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import glob
          import os
          from pathlib import Path
          root = Path('release-assets')
          windows = sorted(root.glob('**/Waveify-*-windows*'))
          macos = sorted(root.glob('**/Waveify-*-macos*'))
          if not windows and not macos:
              raise SystemExit('No packaged desktop artifacts were found.')
          for path in windows + macos:
              print(path)
          PY

      - name: Generate appcast.xml
        env:
          APP_NAME: Waveify
          APP_VERSION: ${{ steps.version.outputs.version }}
          APPCAST_URL: https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml
          WINDOWS_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Waveify-${{ steps.version.outputs.version }}-windows.exe
          MACOS_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/Waveify-${{ steps.version.outputs.version }}-macos.zip
          WINDOWS_SIGNATURE: ${{ secrets.WINDOWS_DSA_SIGNATURE }}
          MACOS_SIGNATURE: ${{ secrets.MACOS_ED_SIGNATURE }}
        run: |
          python3 tool/generate_appcast.py > appcast.xml

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Waveify ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/**/Waveify-*.exe
            release-assets/**/Waveify-*.zip
            appcast.xml
